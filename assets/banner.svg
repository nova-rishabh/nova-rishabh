<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141432"/>
      <stop offset="50%" stop-color="#1A1A44"/>
      <stop offset="100%" stop-color="#141432"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#292966" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#292966" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#5C5C99" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CCCCFF"/>
      <stop offset="100%" stop-color="#A3A3CC"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="220" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="220" rx="12" fill="url(#grid)"/>

  <!-- Ambient Glow Behind Name -->
  <rect width="1200" height="220" rx="12" fill="url(#centerGlow)"/>

  <!-- Outer Precision Border -->
  <rect x="1" y="1" width="1198" height="218" rx="11" fill="none" stroke="#5C5C99" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Technical Corner Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#CCCCFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 1188 28 L 1188 12 L 1172 12" stroke="#CCCCFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 12 192 L 12 208 L 28 208" stroke="#CCCCFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 1188 192 L 1188 208 L 1172 208" stroke="#CCCCFF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Metadata / Telemetry Bar -->
  <text x="50%" y="48" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Space Grotesk', -apple-system, monospace" font-size="12" font-weight="600" fill="#A3A3CC" letter-spacing="3">
    SYSTEMS ARCHITECT  •  AI &amp; EMBEDDED BUILDER  •  FOUNDER
  </text>

  <!-- Divider Line Beneath Tag -->
  <line x1="420" y1="62" x2="780" y2="62" stroke="#5C5C99" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Primary Name Heading -->
  <text x="50%" y="118" text-anchor="middle" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)" letter-spacing="4">
    RISHABH KATARIA
  </text>

  <!-- Core Positioning Statement -->
  <text x="50%" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#A3A3CC" letter-spacing="1.5">
    14 y/o Founder of Divergit &amp; VyaparLaunch SI  |  Hardware &amp; Aerospace Prototyper  |  1,720+ Commits
  </text>

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(600, 184)">
    <!-- Gurugram Badge -->
    <rect x="-225" y="-12" width="130" height="22" rx="4" fill="#292966" fill-opacity="0.6" stroke="#5C5C99" stroke-width="0.8"/>
    <text x="-160" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#CCCCFF">GURUGRAM, IN</text>

    <!-- Velocity Badge -->
    <rect x="-85" y="-12" width="170" height="22" rx="4" fill="#292966" fill-opacity="0.6" stroke="#5C5C99" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#CCCCFF">1,720+ CONTRIBUTIONS</text>

    <!-- Status Badge -->
    <rect x="95" y="-12" width="130" height="22" rx="4" fill="#292966" fill-opacity="0.6" stroke="#5C5C99" stroke-width="0.8"/>
    <text x="160" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#CCCCFF">ACTIVE SYSTEMS</text>
  </g>
</svg>
