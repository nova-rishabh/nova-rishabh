<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light background built from the palette's lighter tones -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F7FF"/>
      <stop offset="55%" stop-color="#ECECFF"/>
      <stop offset="100%" stop-color="#D9D9FC"/>
    </linearGradient>

    <radialGradient id="glow" cx="88%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#CCCCFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CCCCFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#5C5C99" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="220" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="220" rx="12" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="218" rx="11" fill="none" stroke="#CCCCFF" stroke-width="1.5"/>

  <!-- Role line -->
  <text x="50%" y="52" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5C5C99" letter-spacing="3.5">
    FOUNDER  ·  AI ENGINEER  ·  HARDWARE BUILDER
  </text>

  <!-- Name -->
  <text x="50%" y="112" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#292966">Rishabh </tspan><tspan fill="#5C5C99">Kataria</tspan>
  </text>

  <!-- Positioning statement -->
  <text x="50%" y="145" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#5C5C99">
    Founder of VyaparLaunch SI &amp; Divergit  ·  Gurugram, India
  </text>

  <!-- Focus chips -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#292966" letter-spacing="1.2" text-anchor="middle">
    <rect x="372" y="166" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#CCCCFF"/>
    <text x="424" y="183">AI &amp; AGENTS</text>
    <rect x="486" y="166" width="164" height="26" rx="13" fill="#FFFFFF" stroke="#CCCCFF"/>
    <text x="568" y="183">EMBEDDED HARDWARE</text>
    <rect x="660" y="166" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#CCCCFF"/>
    <text x="708" y="183">WEB &amp; SAAS</text>
    <rect x="766" y="166" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#CCCCFF"/>
    <text x="797" y="183">WEB3</text>
  </g>
</svg>
